<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch A Sketch</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Etch A Sketch</h1>
  <div class="buttons-container">
    <button class="change-grid-size" >Change grid size</button>
    <div>|</div>
    <button class="normal-mode">Normal</button>
    <button class="rainbow-mode">Rainbow</button>
    <button class="darkening-mode">Darkening</button>
    <div>|</div>
    <button class="eraze-button">Eraze</button>
    <button class="clear-button">Clear</button>
  </div>
  <div class="main-container"></div>
  <p class="paint-status"></p>
</body>
</html>
